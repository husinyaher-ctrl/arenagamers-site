<!DOCTYPE html>
<html lang="id"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Main Game - ArenaGamers</title>
<link rel="icon" href="icon-192.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#0d0d13;color:#fff;font-family:Segoe UI,sans-serif;overflow:hidden}
.nav{background:#161622;padding:10px 14px;display:flex;align-items:center;gap:10px}
.btn{background:#ff0080;color:#fff;text-decoration:none;padding:7px 14px;border-radius:6px;font-weight:700;font-size:13px}
.judul{font-size:13px;color:#a1a1aa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#game{width:100%;height:calc(100vh - 95px);background:#000;display:flex;align-items:center;justify-content:center}
iframe{width:100%;height:100%;border:0}
.iklan{height:45px;background:#161622;text-align:center;line-height:45px;font-size:11px;color:#555}
</style>
</head><body>
<div class="nav"><a href="index.html" class="btn">◀ Menu</a><div class="judul" id="judul">Memuat...</div></div>
<div id="game">Memuat game...</div>
<div class="iklan">Area Iklan Bawah (Monetag / AdSense) - ads.txt valid</div>
<script src="assets/js/games-feed.js"></script>
<script>
const params=new URLSearchParams(location.search);
const id=params.get('id')||params.get('game')||params.get('slug');
const box=document.getElementById('game');
const judulEl=document.getElementById('judul');
getGamesCatalog().then(games=>{
  const game=games.find(g=> String(g.id)===String(id) );
  if(!game){
    judulEl.textContent='Game tidak ditemukan';
    box.innerHTML='<div style="text-align:center;padding:30px"><h2>Game not found!</h2><p>ID: '+(id||'-')+' tidak ada di data-game.json<br>Total game: '+games.length+'</p><a href="index.html" style="color:#ff0080">Kembali ke Menu</a></div>';
    return;
  }
  judulEl.textContent=game.title;
  document.title=game.title+' - ArenaGamers';
  if(!game.url){ box.innerHTML='URL game kosong'; return; }
  box.innerHTML='<iframe src="'+game.url+'" allowfullscreen></iframe>';
}).catch(e=>{ box.innerHTML='Gagal load: '+e.message; });
</script>
</body></html>
